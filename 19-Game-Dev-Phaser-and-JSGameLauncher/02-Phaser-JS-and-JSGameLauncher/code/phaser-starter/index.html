<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 19.2 — Phaser 3 &amp; jsgamelauncher Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020617;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      border: 2px solid #22d3ee;
    }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <script>
    (function () {
      function resizeFirstCanvas() {
        const canvas = document.querySelector('canvas');
        if (!canvas) return;
        const ar = (canvas.width || 640) / (canvas.height || 480);
        const ww = window.innerWidth;
        const wh = window.innerHeight;
        if (ww / wh > ar) {
          canvas.style.width = `${Math.floor(wh * ar)}px`;
          canvas.style.height = `${wh}px`;
        } else {
          canvas.style.width = `${ww}px`;
          canvas.style.height = `${Math.floor(ww / ar)}px`;
        }
      }
      window.addEventListener('resize', resizeFirstCanvas);
      window.addEventListener('load', resizeFirstCanvas);
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
