<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 19.1 — 4:3 Canvas Arcade &amp; Gamepad Starter</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #0f172a;
      border: 2px solid #38bdf8;
      image-rendering: pixelated;
      cursor: pointer;
    }
    .hud-hint {
      position: fixed;
      bottom: 8px;
      font-size: 12px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 10px;
      border-radius: 999px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Standard 4:3 internal resolution matching handheld & jsgamelauncher defaults -->
  <canvas id="game-canvas" width="640" height="480" aria-label="4:3 Arcade Game Canvas"></canvas>
  <div class="hud-hint">
    Move: Arrows / D-Pad &bull; Action/Boost: Z / South &bull; Pause: Enter / Start &bull; Click Canvas: Fullscreen
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('game-canvas');
      if (!canvas) return;
      function resizeCanvas() {
        const aspect = canvas.width / canvas.height;
        const ww = window.innerWidth;
        const wh = window.innerHeight;
        if (ww / wh > aspect) {
          canvas.style.width = `${Math.floor(wh * aspect)}px`;
          canvas.style.height = `${wh}px`;
        } else {
          canvas.style.width = `${ww}px`;
          canvas.style.height = `${Math.floor(ww / aspect)}px`;
        }
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      canvas.addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen?.();
        } else {
          canvas.requestFullscreen?.();
        }
      });
    })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
