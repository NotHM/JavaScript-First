tasks:
  - init: npm install
# Uncomment the line below when working on the MongoDB section:
#   command: mkdir -p /workspace/data && mongod --dbpath /workspace/data

image:
  file: .gitpod.Dockerfile

vscode:
  extensions:
    # Presentations & Markdown Publishing
    - evilz.vscode-reveal
    - yzhang.markdown-all-in-one
    - davidanson.vscode-markdownlint
    - shd101wyy.markdown-preview-enhanced
    - bierner.markdown-mermaid
    - hediet.vscode-drawio
    # Code Execution & Formatting
    - formulahendry.code-runner
    - esbenp.prettier-vscode
    - svipas.control-snippets
    # Collaboration & Teaching
    - vsls-contrib.codetour
    - genuitecllc.codetogether
    - aaron-bond.better-comments
    - adpyke.codesnap
    # Documentation & SVG
    - joelday.docthis
    - jock.svg
    - idleberg.svg-icons

ports:
  - port: 3000
    onOpen: open-preview
  - port: 7000
    onOpen: open-preview