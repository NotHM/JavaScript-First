<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo 10.2: Responsive Grid, 2D Canvas & LocalStorage</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 1.5rem auto; max-width: 820px; padding: 0 1rem; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    canvas { border: 2px solid #0f172a; background: #f8fafc; width: 100%; height: auto; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
    @media print { .controls { display: none; } }
  </style>
</head>
<body>
  <main class="layout">
    <section class="controls">
      <h1>2D Canvas Transform Demo</h1>
      <label for="deg">Rotate Degrees: <span id="degOut">45</span>°</label>
      <input id="deg" type="range" min="0" max="360" value="45" />
      <label for="zoom">Scale Factor: <span id="zoomOut">1.0</span>x</label>
      <input id="zoom" type="range" min="0.5" max="2.0" step="0.1" value="1.0" />
    </section>
    <section>
      <canvas id="stage" width="320" height="240"></canvas>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const degEl = document.getElementById('deg');
    const zoomEl = document.getElementById('zoom');

    function render() {
      const deg = Number(degEl.value);
      const scale = Number(zoomEl.value);
      document.getElementById('degOut').textContent = String(deg);
      document.getElementById('zoomOut').textContent = scale.toFixed(1);
      localStorage.setItem('demoTransform', JSON.stringify({ deg, scale }));

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((deg * Math.PI) / 180);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(-45, -25, 90, 50);
      ctx.restore();
    }

    const saved = localStorage.getItem('demoTransform');
    if (saved) {
      const parsed = JSON.parse(saved);
      degEl.value = String(parsed.deg ?? 45);
      zoomEl.value = String(parsed.scale ?? 1.0);
    }

    degEl.addEventListener('input', render);
    zoomEl.addEventListener('input', render);
    render();
  </script>
</body>
</html>
